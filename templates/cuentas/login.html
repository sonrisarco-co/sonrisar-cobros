{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | Sonrisar Cobros</title>
    <link rel="stylesheet" href="{% static 'css/sonrisar-pro.css' %}">
    <style>
        body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4fbfa;font-family:Arial,sans-serif;color:#173f3a}
        .login-card{width:min(390px,calc(100% - 32px));background:#fff;padding:30px;border-radius:18px;box-shadow:0 12px 34px rgba(0,0,0,.09);border:1px solid #d9ece9}
        h1{margin:0 0 8px;color:#08766c}.sub{color:#64748b;margin:0 0 22px}.campo{margin:12px 0}.campo label{display:block;font-weight:700;margin-bottom:6px}.campo input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bfd7d4;border-radius:10px;font-size:16px}
        button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:#16a7a0;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.error{background:#fff1f2;color:#b42318;padding:10px;border-radius:9px;margin-bottom:12px}
    </style>
</head>
<body>
    <form method="post" class="login-card">
        {% csrf_token %}
        <h1>Sonrisar Cobros</h1>
        <p class="sub">Ingresá con tu usuario para comenzar el turno.</p>
        {% for message in messages %}<div class="error">{{ message }}</div>{% endfor %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="campo"><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required autofocus></div>
        <div class="campo"><label for="password">Contraseña</label><input id="password" type="password" name="password" autocomplete="current-password" required></div>
        <button type="submit">Ingresar</button>
    </form>
</body>
</html>
