{% load static %}
{% if request.cobros_live_revision %}
<div id="cobros-live-status"
     data-url="{% url 'cobros_live_revision' %}"
     data-revision="{{ request.cobros_live_revision }}"
     data-manual="{{ request.cobros_live_manual|yesno:'true,false' }}"
     style="display:flex; justify-content:flex-end; align-items:center; flex-wrap:wrap; gap:.4rem .75rem; margin:0 auto .75rem; padding:.5rem 1rem; max-width:1560px; font-size:.875rem; color:#174744;">
    <span role="status">Comprobando actualización automática…</span>
    <span data-live-time hidden></span>
    <button type="button" hidden>Actualizar</button>
</div>
<script defer src="{% static 'js/cobros_live.js' %}?v=2"></script>
{% endif %}
